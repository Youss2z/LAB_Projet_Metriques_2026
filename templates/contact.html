<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      font-family: Arial, sans-serif;
      color: #172033;
      background: #eef3f8;
    }

    .contact-page {
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #dbe4ee;
      border-radius: 8px;
      box-shadow: 0 18px 45px rgba(24, 32, 51, 0.12);
    }

    .intro {
      padding: 42px;
      background: #14213d;
      color: #ffffff;
    }

    .intro p {
      max-width: 280px;
      margin-top: 14px;
      color: #d6deea;
      line-height: 1.6;
    }

    .tag {
      display: inline-block;
      margin-bottom: 18px;
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      color: #e9eef7;
      font-size: 13px;
    }

    h1 {
      font-size: 32px;
      line-height: 1.15;
    }

    .form {
      padding: 42px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #43516a;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #cfd9e5;
      border-radius: 6px;
      padding: 13px 14px;
      color: #172033;
      background: #fbfdff;
      font: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    textarea:focus {
      border-color: #2f80ed;
      box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.14);
    }

    textarea {
      min-height: 132px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 6px;
      border: 0;
      border-radius: 6px;
      padding: 14px 18px;
      color: #ffffff;
      background: #2f80ed;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover {
      background: #246fce;
      transform: translateY(-1px);
    }

    .success {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 6px;
      color: #17613a;
      background: #e7f7ee;
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 760px) {
      .contact-page {
        grid-template-columns: 1fr;
      }

      .intro,
      .form {
        padding: 30px 24px;
      }
    }
  </style>
</head>
<body>
  <main class="contact-page">
    <section class="intro" aria-labelledby="contact-title">
      <span class="tag">Projet M&eacute;triques 2026</span>
      <h1 id="contact-title">Contactez-moi</h1>
      <p>Je vous r&eacute;pondrai dans les plus brefs d&eacute;lais.</p>
    </section>

    <section class="form">
      <div class="field">
        <label for="prenom">Pr&eacute;nom</label>
        <input id="prenom" type="text" placeholder="Votre pr&eacute;nom"/>
      </div>

      <div class="field">
        <label for="nom">Nom</label>
        <input id="nom" type="text" placeholder="Votre nom"/>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Ecrivez votre message ici..."></textarea>
      </div>

      <button onclick="envoyer()">Envoyer le message</button>
      <p class="success" id="ok">Message envoy&eacute; avec succ&egrave;s.</p>
    </section>
  </main>

  <script>
    function envoyer() {
      document.getElementById('ok').style.display = 'block';
    }
  </script>
</body>
</html>
