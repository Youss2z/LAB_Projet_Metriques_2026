<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Températures Paris</title>
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      padding: 34px 20px;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #1f2430;
      background:
        linear-gradient(90deg, rgba(31,36,48,0.04) 1px, transparent 1px),
        linear-gradient(180deg, #f8fafc 0%, #eef3f8 100%);
      background-size: 54px 54px, auto;
    }

    .page {
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    header {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 24px;
      align-items: stretch;
      margin-bottom: 24px;
    }

    .hero {
      padding: 34px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid #d8e1ec;
      box-shadow: 0 18px 38px rgba(31, 36, 48, 0.09);
    }

    .label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      color: #2454c6;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .label::before {
      content: "";
      width: 28px;
      height: 3px;
      border-radius: 999px;
      background: #e30613;
    }

    h1 {
      max-width: 720px;
      color: #111827;
      font-size: clamp(34px, 6vw, 58px);
      line-height: 1;
      letter-spacing: 0;
    }

    h1 span {
      color: #e30613;
    }

    .subtitle {
      max-width: 650px;
      margin-top: 18px;
      color: #5d697c;
      font-size: 16px;
      line-height: 1.6;
    }

    .city-card {
      display: grid;
      align-content: space-between;
      min-height: 210px;
      padding: 26px;
      border-radius: 8px;
      color: #ffffff;
      background: #2454c6;
      box-shadow: 0 18px 38px rgba(36, 84, 198, 0.22);
    }

    .city-card small {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      opacity: 0.82;
    }

    .city-card strong {
      display: block;
      font-size: 46px;
      line-height: 1;
    }

    .city-card span {
      display: block;
      margin-top: 8px;
      font-size: 15px;
      opacity: 0.86;
    }

    .chart-container {
      padding: 26px;
      border: 1px solid #d8e1ec;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 20px 42px rgba(31, 36, 48, 0.1);
    }

    .chart-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e8eef5;
    }

    .chart-heading h2 {
      color: #111827;
      font-size: 21px;
      font-weight: 700;
    }

    #status {
      color: #5d697c;
      font-size: 13px;
      text-align: right;
    }

    #chart_div {
      width: 100%;
      height: 500px;
    }

    footer {
      margin-top: 20px;
      color: #69758a;
      font-size: 12px;
      letter-spacing: 1px;
      text-align: center;
      text-transform: uppercase;
    }

    @media (max-width: 820px) {
      header {
        grid-template-columns: 1fr;
      }

      .hero,
      .city-card,
      .chart-container {
        padding: 22px;
      }

      .city-card {
        min-height: 150px;
      }

      .chart-heading {
        display: block;
      }

      #status {
        margin-top: 8px;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <section class="hero">
        <p class="label">Projet métriques 2026</p>
        <h1>Indicateur météo <span>Paris</span></h1>
        <p class="subtitle">Prévisions de température horaires sur 7 jours, affichées à partir des données open-meteo.com.</p>
      </section>

      <aside class="city-card" aria-label="Ville suivie">
        <small>Ville principale</small>
        <div>
          <strong>Paris</strong>
          <span>France</span>
        </div>
      </aside>
    </header>

    <section class="chart-container">
      <div class="chart-heading">
        <h2>Évolution des températures</h2>
        <p id="status">Chargement des données...</p>
      </div>
      <div id="chart_div"></div>
    </section>

    <footer>Paris · France · open-meteo.com</footer>
  </main>

  <script>
    google.charts.load('current', { packages: ['corechart'] });
    google.charts.setOnLoadCallback(init);

    async function init() {
      try {
        const res = await fetch('/paris');
        const json = await res.json();

        var dataArray = [['Date / Heure', 'Température (°C)']];
        json.forEach(function(point) {
          var parts = point.datetime.split('T');
          dataArray.push([parts[0] + ' ' + parts[1], point.temperature_c]);
        });

        var data = google.visualization.arrayToDataTable(dataArray);

        var options = {
          title: 'Température à Paris (°C) — 7 prochains jours',
          titleTextStyle: { color: '#111827', fontSize: 16, bold: true },
          backgroundColor: 'transparent',
          colors: ['#2454c6'],
          areaOpacity: 0.16,
          legend: { position: 'none' },
          curveType: 'function',
          hAxis: {
            title: 'Date / Heure',
            textStyle: { color: '#5d697c' },
            titleTextStyle: { color: '#5d697c' },
            slantedText: true,
            slantedTextAngle: 45,
            showTextEvery: 24,
            gridlines: { color: '#edf2f7' }
          },
          vAxis: {
            title: '°C',
            textStyle: { color: '#5d697c' },
            titleTextStyle: { color: '#5d697c' },
            gridlines: { color: '#edf2f7' },
            baselineColor: '#d8e1ec'
          },
          chartArea: { width: '85%', height: '70%' },
          tooltip: {
            textStyle: { color: '#000000' },
            showColorCode: true
          }
        };

        var chart = new google.visualization.AreaChart(document.getElementById('chart_div'));
        chart.draw(data, options);

        document.getElementById('status').textContent = '✓ ' + json.length + ' points chargés';
      } catch(err) {
        document.getElementById('status').textContent = 'Erreur : ' + err.message;
      }
    }
  </script>
</body>
</html>
